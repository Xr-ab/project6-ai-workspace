# 同源反代（spec §6 R-H / R-I / R-K 的 nginx 半边）。静态与代理各一段，别混。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # R-H：必须**高于**应用的 max_upload_mb=20。20MiB 的文件 + multipart 边界一定 > 20m，
    # 写 20m 的话 21MiB 那一档被 nginx 先打回 HTML，应用的 DOC_413001 JSON 契约整段不可达
    # （面⑤ 第二半必红）。grossly oversized（>25m）才归 nginx —— 那是登记过的外部边界。
    client_max_body_size 25m;

    # 前端自己的探针：body 形状与后端对齐，探针的「解析 body」口径六行统一。
    # 注意它不代理到 app：这一枚只证「这一容器的 nginx 在应答」，反代通不通由面⑤ 的针证。
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location /api/ {
        # 不带斜杠的 proxy_pass：路径原样透传（/api/v1/x 到 app 仍是 /api/v1/x，
        # 后端就挂在 /api/v1 上）。带斜杠会把 /api 前缀剥掉。
        proxy_pass http://app:8000;
        # 面④：SSE 不能被缓冲。失败形状是「条数对、全在末尾到达」——看着像流，其实是一坨。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        # R-K：把真实客户端串进 XFF；uvicorn 侧 --forwarded-allow-ips 决定信哪一段。
        # 面⑧ 的伪造头会走到这里，$proxy_add_x_forwarded_for 把 nginx 看到的对端追加在后面。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由：非静态资源一律回 index.html（否则 /tasks/xxx 刷新就 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
